name: Bug Report
description: Report a bug or unexpected behavior
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你提交 Bug 报告！请尽量详细填写以下信息，帮助我们快速定位和修复问题。

  - type: input
    id: version
    attributes:
      label: Plugin Version
      description: 插件版本号（可在 AstrBot 后台插件管理中查看）
      placeholder: "e.g. Next-1.1.9"
    validations:
      required: true

  - type: input
    id: astrbot_version
    attributes:
      label: AstrBot Version
      description: AstrBot 框架版本号
      placeholder: "e.g. 4.11.4"
    validations:
      required: true

  - type: dropdown
    id: db_type
    attributes:
      label: Database Type
      description: 你使用的数据库类型
      options:
        - SQLite (default)
        - MySQL
        - PostgreSQL
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Linux
        - Windows
        - macOS
        - Docker
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      description: 问题严重程度
      options:
        - 1 - 致命
        - 2 - 严重
        - 3 - 一般
        - 4 - 轻微
    validations:
      required: false

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: 期望的修复优先级
      options:
        - 1 - 紧急
        - 2 - 高
        - 3 - 中
        - 4 - 低
    validations:
      required: false

  - type: dropdown
    id: type
    attributes:
      label: Issue Type
      description: 问题类型
      options:
        - 代码错误
        - 配置相关
        - 安装部署
        - 性能问题
        - 其他
    validations:
      required: false

  - type: input
    id: contact
    attributes:
      label: Contact (optional)
      description: 联系邮箱或其它联系方式，便于追问细节
      placeholder: "e.g. you@example.com"
    validations:
      required: false

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: 清晰简洁地描述问题是什么
      placeholder: 描述你遇到的问题...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: 复现问题的步骤
      placeholder: |
        1. 执行命令 '...'
        2. 查看日志 '...'
        3. 出现错误
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: 你期望的正确行为是什么
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Error Logs
      description: 粘贴相关的错误日志（请脱敏敏感信息）
      render: shell
    validations:
      required: false

  - type: textarea
    id: config
    attributes:
      label: Relevant Configuration
      description: 粘贴与问题相关的配置项（请脱敏密码等敏感信息）
      render: yaml
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: Additional Context
      description: 其他有助于排查问题的信息（截图、环境细节等）
    validations:
      required: false
